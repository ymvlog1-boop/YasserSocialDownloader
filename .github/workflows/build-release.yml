name: Build and release Windows application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python build.py
      - name: Verify executable
        shell: pwsh
        run: |
          $app = 'dist/YasserSocialDownloader/YasserSocialDownloader.exe'
          if (!(Test-Path $app)) { throw 'Windows executable was not built.' }
          $version = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          if ($version -ne '1.2.5') { throw "Unexpected source version: $version" }
          $process = Start-Process -FilePath $app -ArgumentList '--version-check' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable version check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: YasserSocialDownloader-Windows-x64-v1.2.5
          path: dist/YasserSocialDownloader/
          if-no-files-found: error
      - name: Package update and publish release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          Compress-Archive -Path 'dist/YasserSocialDownloader/*' -DestinationPath 'YasserSocialDownloader-Windows-x64.zip' -Force
          gh release create $tag 'YasserSocialDownloader-Windows-x64.zip' --title "Yasser Social Downloader $tag" --notes-file "CHANGES-$tag.md" --target $env:GITHUB_SHA
