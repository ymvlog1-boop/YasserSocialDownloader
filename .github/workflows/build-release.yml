name: Build Windows Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore v1.1.0 source bundle
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'bootstrap/source.part*.b64' | Sort-Object Name
          if ($parts.Count -lt 3) { throw 'Source bundle is incomplete.' }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($encoded))
          Expand-Archive -Path 'source.zip' -DestinationPath '.' -Force
          if (!(Test-Path 'requirements.txt') -or !(Test-Path 'build.py') -or !(Test-Path 'app/updater.py')) { throw 'Source restore failed.' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build
        run: python build.py

      - name: Read version and package
        id: pkg
        shell: pwsh
        run: |
          $version = python -c "from app.version import APP_VERSION; print(APP_VERSION)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Compress-Archive -Path 'dist/YasserSocialDownloader/*' -DestinationPath 'YasserSocialDownloader-Windows-x64.zip' -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.pkg.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag YasserSocialDownloader-Windows-x64.zip --clobber
          } else {
            gh release create $tag YasserSocialDownloader-Windows-x64.zip --title "Yasser Social Downloader $tag" --notes "تحديث تلقائي لـ Yasser Social Downloader."
          }

# v1.1.0 bootstrap bundle complete
