name: Build and release Windows applicationon:  push:    branches: [main]  pull_request:    branches: [main]  workflow_dispatch:permissions:  contents: writejobs:  build:    runs-on: windows-latest    steps:      - uses: actions/checkout@v4      - uses: actions/setup-python@v5        with:          python-version: '3.11'          architecture: x64      - name: Install dependencies        run: |          python -m pip install --upgrade pip          python -m pip install -r requirements.txt      - name: Run tests        run: python -m unittest discover -s tests -v      - name: Build application        run: python build.py      - name: Verify executable        shell: pwsh        run: |          $app = 'dist/YasserSocialDownloader/YasserSocialDownloader.exe'          if (!(Test-Path $app)) { throw 'Windows executable was not built.' }          $version = python -c "from app.version import APP_VERSION; print(APP_VERSION)"          if ($version -ne '1.2.7') { throw "Unexpected source version: $version" }
